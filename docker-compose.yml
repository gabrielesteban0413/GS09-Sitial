services:
  api:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      NODE_ENV: production
      PORT: 8000
      DATABASE_URL: postgresql://sitial:${POSTGRES_PASSWORD:-sitial}@postgres:5432/sitial?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 3600
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sitial

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api
    networks:
      - sitial

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sitial
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sitial}
      POSTGRES_DB: sitial
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitial -d sitial"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sitial

  sitial-mysql:
    image: mysql:8.4
    profiles:
      - sitial-java
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
      MYSQL_DATABASE: sitial_db
    ports:
      - "3307:3306"
    volumes:
      - sitial_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - sitial

volumes:
  postgres_data:
  sitial_mysql_data:

networks:
  sitial:
    driver: bridge
